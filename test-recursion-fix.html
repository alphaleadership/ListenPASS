<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recursion Fix Test</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .test-result { margin: 10px 0; padding: 10px; border-radius: 4px; }
        .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .warning { background: #fff3cd; color: #856404; border: 1px solid #ffeaa7; }
        #console { background: #f8f9fa; border: 1px solid #dee2e6; padding: 15px; margin-top: 20px; height: 200px; overflow-y: auto; font-family: monospace; font-size: 12px; }
        input { margin: 10px 0; padding: 5px; width: 200px; }
    </style>
</head>
<body>
    <h1>🔄 Recursion Fix Test</h1>
    <p>This test verifies that the recursion issues have been fixed.</p>
    
    <div id="results"></div>
    
    <!-- Test form -->
    <div>
        <h3>Test Form</h3>
        <input type="text" id="employeeId" name="employeeId" placeholder="Enter employee ID">
        <input type="text" id="fullName" name="fullName" placeholder="Enter full name">
        <canvas id="cardPreview" width="428" height="270" style="border: 1px solid #ccc;"></canvas>
        <div id="previewPlaceholder" style="display: none;"></div>
    </div>
    
    <div id="console"></div>

    <!-- Load modules -->
    <script src="./js/client/data-models.js"></script>
    <script src="./js/client/validation.js"></script>
    <script src="./js/client/error-handler.js"></script>
    <script src="./js/client/performance-optimizer.js"></script>
    <script src="./js/client/api-client.js"></script>
    <script src="./js/client/site-manager.js"></script>
    <script src="./js/client/card-generator.js"></script>
    <script src="./js/client/ui-controller.js"></script>

    <script>
        const results = document.getElementById('results');
        const consoleDiv = document.getElementById('console');
        
        function addResult(type, title, message) {
            const div = document.createElement('div');
            div.className = `test-result ${type}`;
            div.innerHTML = `<strong>${title}:</strong> ${message}`;
            results.appendChild(div);
        }
        
        function log(message) {
            console.log(message);
            consoleDiv.innerHTML += message + '\n';
            consoleDiv.scrollTop = consoleDiv.scrollHeight;
        }
        
        // Track recursion depth
        let updatePreviewCallCount = 0;
        let maxCallCount = 0;
        
        // Override console methods to track calls
        const originalLog = console.log;
        console.log = function(...args) {
            originalLog.apply(console, args);
            log(args.join(' '));
        };
        
        const originalWarn = console.warn;
        console.warn = function(...args) {
            originalWarn.apply(console, args);
            log('⚠️ ' + args.join(' '));
        };
        
        const originalError = console.error;
        console.error = function(...args) {
            originalError.apply(console, args);
            log('❌ ' + args.join(' '));
        };
        
        async function runRecursionTest() {
            log('🚀 Starting recursion fix test...');
            
            try {
                // Test 1: Create UI Controller
                if (!window.UIController) {
                    addResult('error', 'UI Controller', 'UIController class not available');
                    return;
                }
                
                const uiController = new UIController();
                addResult('success', 'UI Controller', 'UIController created successfully');
                
                // Test 2: Create Card Generator
                if (!window.SCPCardGenerator) {
                    addResult('error', 'Card Generator', 'SCPCardGenerator class not available');
                    return;
                }
                
                const cardGenerator = new SCPCardGenerator('researcher', 'client');
                addResult('success', 'Card Generator', 'SCPCardGenerator created successfully');
                
                // Test 3: Test field change handling (potential recursion point)
                const employeeIdField = document.getElementById('employeeId');
                const fullNameField = document.getElementById('fullName');
                
                if (employeeIdField && fullNameField) {
                    // Monitor for excessive calls
                    let fieldChangeCount = 0;
                    const originalHandleFormFieldChange = cardGenerator.handleFormFieldChange;
                    cardGenerator.handleFormFieldChange = function(field) {
                        fieldChangeCount++;
                        if (fieldChangeCount > 10) {
                            addResult('error', 'Recursion Test', `Too many field change calls: ${fieldChangeCount}`);
                            return;
                        }
                        return originalHandleFormFieldChange.call(this, field);
                    };
                    
                    // Simulate user input
                    log('Testing employee ID field changes...');
                    employeeIdField.value = '1234567';
                    employeeIdField.dispatchEvent(new Event('input'));
                    
                    // Wait a bit for any async operations
                    await new Promise(resolve => setTimeout(resolve, 500));
                    
                    if (fieldChangeCount <= 10) {
                        addResult('success', 'Field Changes', `Field change handled without recursion (${fieldChangeCount} calls)`);
                    } else {
                        addResult('error', 'Field Changes', `Recursion detected in field changes (${fieldChangeCount} calls)`);
                    }
                    
                    // Test 4: Test updatePreview calls
                    fieldChangeCount = 0;
                    const originalUpdatePreview = uiController.updatePreview;
                    uiController.updatePreview = function() {
                        fieldChangeCount++;
                        if (fieldChangeCount > 5) {
                            addResult('error', 'Update Preview', `Too many updatePreview calls: ${fieldChangeCount}`);
                            return;
                        }
                        return originalUpdatePreview.call(this);
                    };
                    
                    log('Testing updatePreview calls...');
                    fullNameField.value = 'Dr. Test Subject';
                    fullNameField.dispatchEvent(new Event('input'));
                    
                    await new Promise(resolve => setTimeout(resolve, 500));
                    
                    if (fieldChangeCount <= 5) {
                        addResult('success', 'Update Preview', `UpdatePreview handled without recursion (${fieldChangeCount} calls)`);
                    } else {
                        addResult('error', 'Update Preview', `Recursion detected in updatePreview (${fieldChangeCount} calls)`);
                    }
                    
                } else {
                    addResult('warning', 'Form Fields', 'Test form fields not found');
                }
                
                // Test 5: Test async initialization
                log('Testing async card generator initialization...');
                let initCallCount = 0;
                const originalInitialize = uiController.initializeCardGenerator;
                uiController.initializeCardGenerator = async function(cardType) {
                    initCallCount++;
                    if (initCallCount > 3) {
                        addResult('error', 'Async Init', `Too many initialization calls: ${initCallCount}`);
                        return;
                    }
                    return originalInitialize.call(this, cardType);
                };
                
                // Try to initialize multiple times quickly
                uiController.initializeCardGenerator('researcher');
                uiController.initializeCardGenerator('researcher');
                uiController.initializeCardGenerator('researcher');
                
                await new Promise(resolve => setTimeout(resolve, 1000));
                
                if (initCallCount <= 3) {
                    addResult('success', 'Async Init', `Async initialization handled correctly (${initCallCount} calls)`);
                } else {
                    addResult('error', 'Async Init', `Recursion detected in async initialization (${initCallCount} calls)`);
                }
                
                log('🏁 Recursion tests completed!');
                
            } catch (error) {
                addResult('error', 'Test Error', `Test failed with error: ${error.message}`);
                log(`❌ Test error: ${error.message}`);
                console.error('Full error:', error);
            }
        }
        
        // Wait for all scripts to load, then run tests
        window.addEventListener('load', () => {
            setTimeout(runRecursionTest, 100);
        });
    </script>
</body>
</html>
