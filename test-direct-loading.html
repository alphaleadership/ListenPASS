<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Direct Loading</title>
</head>
<body>
    <h1>Test Direct Loading</h1>
    <div id="output"></div>

    <script>
        const output = document.getElementById('output');
        
        function log(message) {
            console.log(message);
            output.innerHTML += message + '<br>';
        }
        
        // Capture all errors
        window.addEventListener('error', function(e) {
            log('❌ ERROR: ' + e.message + ' at ' + e.filename + ':' + e.lineno);
        });
        
        log('🔍 Testing direct script loading...');
        log('Before: window.SCPCardGenerator = ' + typeof window.SCPCardGenerator);
        
        // Load script and check immediately
        const script = document.createElement('script');
        script.textContent = `
            console.log('📝 Inline script executing...');
            
            // Test simple class definition
            class TestSCPCardGenerator {
                constructor(cardType) {
                    this.cardType = cardType;
                    console.log('TestSCPCardGenerator created:', cardType);
                }
            }
            
            // Export to window
            window.TestSCPCardGenerator = TestSCPCardGenerator;
            console.log('TestSCPCardGenerator exported:', typeof window.TestSCPCardGenerator);
        `;
        
        document.head.appendChild(script);
        
        log('After inline script: window.TestSCPCardGenerator = ' + typeof window.TestSCPCardGenerator);
        
        // Now try loading the actual file
        log('Loading actual card-generator.js...');
        
        const actualScript = document.createElement('script');
        actualScript.src = './js/client/card-generator.js';
        
        actualScript.onload = function() {
            log('✅ card-generator.js loaded');
            log('After loading: window.SCPCardGenerator = ' + typeof window.SCPCardGenerator);
            
            if (window.SCPCardGenerator) {
                log('🎉 SUCCESS!');
            } else {
                log('❌ STILL UNDEFINED - checking for errors...');
                
                // Check if the debug logs from the script appeared
                log('Checking debug flags:');
                log('- SCP_CARD_GENERATOR_LOADED: ' + window.SCP_CARD_GENERATOR_LOADED);
                log('- SCP_CARD_GENERATOR_TIMESTAMP: ' + window.SCP_CARD_GENERATOR_TIMESTAMP);
            }
        };
        
        actualScript.onerror = function() {
            log('❌ Failed to load card-generator.js');
        };
        
        document.head.appendChild(actualScript);
    </script>
</body>
</html>
