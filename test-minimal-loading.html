<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimal Loading Test</title>
</head>
<body>
    <h1>Minimal SCPCardGenerator Loading Test</h1>
    <div id="output"></div>

    <script>
        const output = document.getElementById('output');
        
        function log(message) {
            console.log(message);
            output.innerHTML += message + '<br>';
        }
        
        // Check before loading
        log('BEFORE loading: window.SCPCardGenerator = ' + typeof window.SCPCardGenerator);
        
        // Set up error handling
        window.addEventListener('error', function(e) {
            log('❌ JavaScript Error: ' + e.message + ' at ' + e.filename + ':' + e.lineno);
        });
        
        // Load the script and check immediately after
        const script = document.createElement('script');
        script.src = './js/client/card-generator.js';
        script.onload = function() {
            log('✅ Script loaded successfully');
            log('AFTER loading: window.SCPCardGenerator = ' + typeof window.SCPCardGenerator);
            log('AFTER loading: window.CardTemplate = ' + typeof window.CardTemplate);
            log('AFTER loading: window.UnifiedCardInterface = ' + typeof window.UnifiedCardInterface);
            
            if (window.SCPCardGenerator) {
                log('🎉 SUCCESS: SCPCardGenerator is available!');
                try {
                    const gen = new SCPCardGenerator('researcher');
                    log('✅ Instantiation successful');
                } catch (err) {
                    log('❌ Instantiation failed: ' + err.message);
                }
            } else {
                log('❌ FAILURE: SCPCardGenerator is still not available');
                log('Available window properties with SCP: ' + Object.keys(window).filter(k => k.includes('SCP')));
            }
        };
        
        script.onerror = function() {
            log('❌ Failed to load script');
        };
        
        document.head.appendChild(script);
    </script>
</body>
</html>
