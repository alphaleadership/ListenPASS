<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Modules Only</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .module { padding: 10px; margin: 5px 0; border-radius: 4px; }
        .loaded { background: #d4edda; color: #155724; }
        .missing { background: #f8d7da; color: #721c24; }
        .loading { background: #fff3cd; color: #856404; }
    </style>
</head>
<body>
    <h1>🔍 Module Loading Test</h1>
    <div id="moduleStatus"></div>
    
    <script>
        const modules = [
            { name: 'PersonnelCard', file: './js/client/data-models.js' },
            { name: 'ValidationError', file: './js/client/validation.js' },
            { name: 'ErrorHandler', file: './js/client/error-handler.js' },
            { name: 'PerformanceOptimizer', file: './js/client/performance-optimizer.js' },
            { name: 'APIClient', file: './js/client/api-client.js' },
            { name: 'ClientSiteManager', file: './js/client/site-manager.js' },
            { name: 'SCPCardGenerator', file: './js/client/card-generator.js' },
            { name: 'UnifiedCardInterface', file: './js/client/card-generator.js' }
        ];
        
        function updateModuleStatus() {
            const statusDiv = document.getElementById('moduleStatus');
            statusDiv.innerHTML = '';
            
            modules.forEach(module => {
                const div = document.createElement('div');
                div.className = 'module';
                
                if (window[module.name]) {
                    div.className += ' loaded';
                    div.innerHTML = `✅ ${module.name} - Loaded`;
                } else {
                    div.className += ' missing';
                    div.innerHTML = `❌ ${module.name} - Missing`;
                }
                
                statusDiv.appendChild(div);
            });
        }
        
        async function loadModulesSequentially() {
            const statusDiv = document.getElementById('moduleStatus');
            
            for (const module of modules) {
                // Skip duplicates
                if (module.name === 'UnifiedCardInterface') continue;
                
                const div = document.createElement('div');
                div.className = 'module loading';
                div.innerHTML = `⏳ Loading ${module.name}...`;
                statusDiv.appendChild(div);
                
                try {
                    await loadScript(module.file);
                    console.log(`✅ Loaded: ${module.file}`);
                    
                    // Wait a bit for the module to initialize
                    await new Promise(resolve => setTimeout(resolve, 100));
                    
                } catch (error) {
                    console.error(`❌ Failed to load: ${module.file}`, error);
                }
                
                updateModuleStatus();
            }
            
            // Final test
            console.log('🧪 Testing module functionality...');
            
            if (window.PersonnelCard) {
                try {
                    const card = new PersonnelCard({ fullName: 'Test User' });
                    console.log('✅ PersonnelCard works:', card.getDisplayName());
                } catch (error) {
                    console.error('❌ PersonnelCard error:', error);
                }
            }
            
            if (window.SCPCardGenerator) {
                try {
                    const generator = new SCPCardGenerator('researcher');
                    console.log('✅ SCPCardGenerator works');
                } catch (error) {
                    console.error('❌ SCPCardGenerator error:', error);
                }
            }
            
            if (window.UnifiedCardInterface) {
                try {
                    const ui = new UnifiedCardInterface();
                    console.log('✅ UnifiedCardInterface works');
                } catch (error) {
                    console.error('❌ UnifiedCardInterface error:', error);
                }
            }
        }
        
        function loadScript(src) {
            return new Promise((resolve, reject) => {
                const script = document.createElement('script');
                script.src = src;
                script.onload = resolve;
                script.onerror = reject;
                document.head.appendChild(script);
            });
        }
        
        // Start loading
        document.addEventListener('DOMContentLoaded', () => {
            console.log('🚀 Starting module loading test...');
            loadModulesSequentially().then(() => {
                console.log('🎉 Module loading test completed!');
            }).catch(error => {
                console.error('💥 Module loading failed:', error);
            });
        });
    </script>
</body>
</html>
