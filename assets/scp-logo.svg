<?xml version="1.0" encoding="UTF-8"?>
<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- SCP Foundation Logo -->
  <defs>
    <style>
      .logo-text { font-family: Arial, sans-serif; font-weight: bold; }
      .logo-bg { fill: #000000; }
      .logo-fg { fill: #ffffff; }
      .logo-accent { fill: #cc0000; }
    </style>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="50" cy="50" r="48" class="logo-bg" stroke="#333" stroke-width="2"/>
  
  <!-- SCP Text -->
  <text x="50" y="35" text-anchor="middle" class="logo-text logo-fg" font-size="16">SCP</text>
  
  <!-- Foundation Text -->
  <text x="50" y="50" text-anchor="middle" class="logo-text logo-fg" font-size="8">FOUNDATION</text>
  
  <!-- Security Symbol -->
  <g transform="translate(50, 65)">
    <!-- Shield shape -->
    <path d="M-8,-5 L8,-5 L8,5 L0,10 L-8,5 Z" class="logo-accent"/>
    <!-- Lock symbol -->
    <rect x="-3" y="-2" width="6" height="4" class="logo-fg"/>
    <circle cx="0" cy="-4" r="2" fill="none" stroke="#ffffff" stroke-width="1"/>
  </g>
  
  <!-- Classification markers -->
  <g class="logo-accent">
    <rect x="15" y="15" width="8" height="2"/>
    <rect x="77" y="15" width="8" height="2"/>
    <rect x="15" y="83" width="8" height="2"/>
    <rect x="77" y="83" width="8" height="2"/>
  </g>
</svg>